<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Facilitator console — facilitated sats orders</title>
  <!--
    Installable (Android/Chrome install prompt + iOS Add to Home Screen).
    manifest.webmanifest pins id, start_url and scope to the absolute /console/
    path: this client must never claim the customer app or the money API, and the
    registration below pins the same scope on the worker, so a wider scope can
    never be inferred from the registration call either.
  -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Console">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    Facilitator console for facilitated sats orders (cvm-protocol PLAN-0007 T4).

    CARD CUSTODY (ADR-0013, operator decision 2026-10-09): this console NEVER
    receives, renders, stores, logs or transmits PAN/CVV. The fiat leg is
    device-initiated: the console hands off to the venue's / PSP's own payment
    page (or, when a PSP is chosen, to that PSP's hosted card fields). Our order
    service receives only a reference and the outcome. There is deliberately no
    card input in this document - see the card-custody guard in app.js and
    tests/console_pwa_test.ts, which fail the build if one appears.
  -->
  <main id="app" aria-live="polite"><p class="loading">Connecting to the order service…</p></main>
  <script type="module" src="app.js"></script>
  <script>
    // Offline shell. Registration is best-effort and strictly additive: on a
    // browser without service workers, in an insecure context, or on any
    // registration error, the console UI must keep working untouched. The
    // relative script path resolves to /console/sw.js, which is what makes the
    // explicit scope "/console/" legal (and safe: never "/", and never the
    // money API this console reads).
    if ("serviceWorker" in navigator && window.isSecureContext) {
      window.addEventListener("load", function () {
        try {
          navigator.serviceWorker.register("sw.js", { scope: "/console/" }).catch(function (err) {
            console.warn("console: service worker not registered", err);
          });
        } catch (err) {
          console.warn("console: service worker registration threw", err);
        }
      });
    }
  </script>
</body>
</html>
