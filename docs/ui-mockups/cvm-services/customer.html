<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer — paying ContextVMs (mockup)</title>
<style>
  :root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b18;--dim:#6f6b62;--line:#e7e4dd;
        --accent:#7c3aed;--accentbg:#f3edff;--ok:#15803d;--okbg:#ecfdf3;--off:#9a958a;--offbg:#f1efea}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .phone{width:390px;min-height:844px;margin:0 auto;display:flex;flex-direction:column;position:relative}
  .screen{display:none;flex-direction:column;min-height:844px;padding-bottom:70px}
  .screen.on{display:flex}
  .hd{padding:18px 16px 8px}
  .hd h1{font-size:22px;letter-spacing:-.02em}
  .sub{font-size:12.5px;color:var(--dim);margin-top:3px}
  .bal{font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 11px}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1}
  .sat{font-weight:700;letter-spacing:-.02em}
  .fiat{color:var(--off);font-size:12px}
  .search{margin:8px 16px 2px;display:flex;gap:8px}
  .search input{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-size:14px;color:inherit}
  .fbtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 14px;font-size:13px;font-weight:600}
  .list{padding:10px 16px;display:flex;flex-direction:column;gap:10px}
  .svc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:block;text-decoration:none;color:inherit}
  .svc h2{font-size:16.5px;letter-spacing:-.01em}
  .svc .blurb{font-size:12.5px;color:var(--dim);margin-top:3px}
  .tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:3px 9px;background:#fff}
  .chip.ok{color:var(--ok);background:var(--okbg);border-color:#cdeed9}
  .chip.off{color:var(--off);background:var(--offbg)}
  .svc.off{background:#fbfaf8;border-style:dashed}
  .svc.off h2{color:var(--off)}
  .price{margin-top:10px;display:flex;align-items:baseline;gap:8px}
  .arrow{color:#b9b4a8;font-size:18px}
  .trust{margin:0 16px;font-size:11.5px;color:var(--dim);border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px}
  .trust b{color:var(--ink)}
  .body{padding:6px 16px;font-size:13.5px;line-height:1.5;color:#3d3a34}
  .needs{margin:12px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
  .needs h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--off);margin-bottom:8px}
  .needs li{list-style:none;font-size:13px;padding:4px 0;display:flex;gap:8px;align-items:center}
  .needs li span{color:var(--dim);font-size:12px}
  details{margin:10px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  summary{font-size:13px;font-weight:600;cursor:pointer}
  .kv{display:grid;grid-template-columns:118px 1fr;gap:6px 10px;margin-top:10px;font-size:12px}
  .kv dt{color:var(--off)}.kv dd{color:#3d3a34;word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
  .cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:390px;padding:12px 16px 14px;background:linear-gradient(#f6f5f200,#f6f5f2 28%);border:0}
  .btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:15px;font-weight:650;background:var(--accent);color:#fff;display:flex;justify-content:center;gap:10px;align-items:center}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn[disabled]{background:var(--offbg);color:var(--off)}
  .tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:390px;display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 6px 10px}
  .tab{flex:1;text-align:center;font-size:10.5px;color:var(--off)}
  .tab b{display:block;font-size:17px;font-weight:400;line-height:1.25}
  .tab.on{color:var(--accent);font-weight:650}
  .steps{margin:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
  .step{display:flex;gap:10px;padding:7px 0;font-size:13px;align-items:flex-start}
  .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px}
  .step.done .dot{background:var(--ok);border-color:var(--ok)}
  .step.now .dot{border-color:var(--accent);border-style:dashed}
  .step small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  .rate{margin:12px 16px;font-size:12px;color:var(--dim)}
  .warn{margin:12px 16px;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:11px 12px;font-size:12px;color:#7c4a02}
</style>
</head>
<body>
<div class="phone" id="app"></div>

<script>
const RATE = {sat_per_eur: 1000, label: "1 € ≈ 1 000 sats"};
// The whole screen is rendered from this JSON — no per-service markup.
const SERVICES = [
  {id:"sms", name:"SMS via nosms", blurb:"Send an SMS with a Cashu-paid postage. Real handset, no account needed.",
   sats:500, fiat:"0,50 €", status:"ok", statusText:"live",
   needs:[["Phone number","+49 ••• •••123"],["Message text","up to 160 chars"]],
   trust:"No personal data beyond settlement. Postage is paid per message.",
   kind:"11316", geohash:"u33d", npub:"npub1al953lfy…nxsd9q6lw3w9", cap:"cap:tool:sms.send:500:sats",
   receipt:"delivery_receipts: false — the carrier rail is best-effort"},
  {id:"wa", name:"WhatsApp via nosms", blurb:"Send a WhatsApp message from a real registered handset.",
   sats:900, fiat:"0,90 €", status:"off", statusText:"unavailable",
   needs:[["Registration","pending — no account on the device yet"]],
   trust:"Same rails as SMS. Not offered until the device is registered.",
   kind:"11316", geohash:"u33d", npub:"npub1al953lfy…nxsd9q6lw3w9", cap:"cap:tool:wa.send:900:sats",
   receipt:"delivery_receipts: false"},
  {id:"charge", name:"EV charging", blurb:"Pay for a charge point session, sats only.",
   sats:1200, fiat:"1,20 €", status:"ok", statusText:"live",
   needs:[["Charge point","Berlin-Mitte •••"],["Session","kWh budget"]],
   trust:"Settlement only. The operator relays the start command to the point.",
   kind:"11317", geohash:"u33d", npub:"npub1ftjlarsn0k4…hsah7hqu", cap:"cap:tool:charge.start:1200:sats",
   receipt:"delivery_receipts: true"}
];
const byId = id => SERVICES.find(s => s.id === id);
const eur = s => (s.sats / RATE.sat_per_eur).toFixed(2).replace('.', ',') + " €";

function tabbar(active){
  const t = [["Wallet","◍"],["Send","↗"],["Receive","↙"],["Services","▦"],["Settings","⚙"]];
  return `<nav class="tabs">${t.map(([n,i]) =>
    `<div class="tab${n===active?" on":""}"><b>${i}</b>${n}</div>`).join("")}</nav>`;
}
function svcRow(s){
  const off = s.status === "off";
  return `<a class="svc${off?" off":""}" href="?s=2&id=${s.id}">
    <div class="row"><div class="grow">
      <h2>${s.name}</h2><div class="blurb">${s.blurb}</div>
    </div>${off ? "" : `<span class="arrow">›</span>`}</div>
    <div class="tags"><span class="chip ${off?"off":"ok"}">${s.statusText}</span>
      <span class="chip">Cashu</span></div>
    <div class="price"><span class="sat">${s.sats} sats</span><span class="fiat">${s.fiat}</span></div>
  </a>`;
}
const V = { id: new URLSearchParams(location.search).get("id") || "sms" };

function s1(){
  return `<section class="screen on">
    <div class="hd"><div class="row"><div class="grow">
      <h1>Services</h1><div class="sub">Pay per use with Cashu. No accounts.</div>
    </div><span class="bal">21 400 sats</span></div></div>
    <div class="search"><input placeholder="Search services…" value=""><button class="fbtn">Filters</button></div>
    <div class="list">${SERVICES.map(svcRow).join("")}</div>
    <div class="trust"><b>What you are paying for:</b> each row is one service run by a
      facilitator. You pay postage in sats; the facilitator does the work and settles.</div>
    ${tabbar("Services")}</section>`;
}
function s2(){
  const s = byId(V.id) || SERVICES[0], off = s.status === "off";
  return `<section class="screen on">
    <div class="hd"><div class="row"><span class="fbtn" onclick="location='?s=1'">‹</span>
      <div class="grow"><h1>${s.name}</h1><div class="sub">run by a CVM facilitator</div></div></div></div>
    <div class="body">${s.blurb}</div>
    <div class="needs"><h3>What this needs from you</h3><ul>
      ${s.needs.map(([k,v]) => `<li><b>${k}</b><span>${v}</span></li>`).join("")}</ul></div>
    <div class="price" style="margin:0 16px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)">
      <span class="sat" style="font-size:20px">${s.sats} sats</span>
      <span class="fiat">${s.fiat}</span></div>
    <div class="rate">Rate: ${RATE.label} — shown once, not a live quote.</div>
    <details><summary>Details</summary><dl class="kv">
      <dt>kind</dt><dd>${s.kind}</dd>
      <dt>service id</dt><dd>${s.id}</dd>
      <dt>geohash</dt><dd>${s.geohash}</dd>
      <dt>provider</dt><dd>${s.npub}</dd>
      <dt>cap</dt><dd>${s.cap}</dd>
      <dt>delivery</dt><dd>${s.receipt}</dd></dl></details>
    <div class="trust">${s.trust}</div>
    <div class="cta">${off
      ? `<button class="btn" disabled>Not available yet</button>`
      : `<button class="btn" onclick="location='?s=3&id=${s.id}'">Pay ${s.sats} sats &amp; run</button>`}</div>
  </section>`;
}
function s3(){
  const s = byId(V.id) || SERVICES[0];
  return `<section class="screen on">
    <div class="hd"><div class="row"><span class="fbtn" onclick="location='?s=2&id=${s.id}'">‹</span>
      <div class="grow"><h1>Pay</h1><div class="sub">${s.name}</div></div></div></div>
    <div class="steps">
      <div class="step done"><span class="dot"></span><div>Quote<div><small>${s.sats} sats · ${s.fiat}</small></div></div></div>
      <div class="step now"><span class="dot"></span><div>Waiting for payment<div><small>invoice below · expires 15 min</small></div></div></div>
      <div class="step"><span class="dot"></span><div>Service runs<div><small>the facilitator runs it for you</small></div></div></div>
    </div>
    <div class="trust"><b>Cashu invoice</b><br><span style="font-family:ui-monospace,Menlo,monospace;font-size:11px">
      [mockup invoice placeholder — no real token in this file]</span></div>
    <div class="rate">Rate: ${RATE.label}</div>
    <div class="cta"><button class="btn" onclick="location='?s=4&id=${s.id}'">I have paid — run it</button></div>
  </section>`;
}
function s4(){
  const s = byId(V.id) || SERVICES[0];
  return `<section class="screen on">
    <div class="hd"><h1>${s.id==="sms"?"Message sent":"Order placed"}</h1>
      <div class="sub">Paid ${s.sats} sats · ${s.fiat}</div></div>
    <div class="steps">
      <div class="step done"><span class="dot"></span><div>Paid<div><small>settlement token accepted</small></div></div></div>
      <div class="step done"><span class="dot"></span><div>Facilitator ran your request<div><small>nosms — the operator of this CVM</small></div></div></div>
      <div class="step ${s.receipt.includes("true")?"done":"now"}"><span class="dot"></span>
        <div>Delivery${s.receipt.includes("true")
          ? `<div><small>confirmed by the rail</small></div>`
          : `<div><small>best-effort rail — you'll see a failure if it did not go out</small></div>`}</div></div>
    </div>
    <div class="trust"><b>Receipt</b><br>id: nq3f…8xk · 2 min ago</div>
    ${s.receipt.includes("true")?``:`<div class="warn">This rail cannot confirm delivery. If the
      message did not go out, the postage is refunded automatically.</div>`}
    <div class="cta"><button class="btn ghost" onclick="location='?s=1'">Done</button></div>
    ${tabbar("Services")}</section>`;
}
document.getElementById("app").innerHTML = [s1,s2,s3,s4][
  Math.max(0, Math.min(3, (parseInt(new URLSearchParams(location.search).get("s")||"1",10))-1))]();
document.title = "Customer — paying ContextVMs (s" + (new URLSearchParams(location.search).get("s")||"1") + ")";
</script>
</body>
</html>
